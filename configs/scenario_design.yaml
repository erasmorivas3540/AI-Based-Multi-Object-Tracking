# Scenario design for the 6-week study. Version this file; every clip manifest
# records its checksum. Values marked PILOT are proposed starting points to be
# checked against measured achieved values in the Week 2 pilot, then frozen.
version: 1

clip:
  duration_s: 20.0
  fps: 20

camera:
  width: 1280
  height: 720
  hfov_deg: 80.0
  image_format: png        # lossless canonical frames (JPEG alters small targets and blur cues)

# ---------------------------------------------------------------- factors
factors:
  camera_motion:
    # Observer orbits the scene centre; orientation looks at the smoothed target
    # centroid plus a yaw/pitch oscillation. Achieved angular and translational
    # speeds are measured per clip and stored in the manifest.        PILOT
    low:
      speed_mps: [0.5, 2.0]
      speed_osc_frac: 0.0          # no acceleration
      yaw_osc_amp_deg: 3.0
      yaw_osc_period_s: [8.0, 12.0]
      pitch_osc_amp_deg: 1.0
    turning:
      speed_mps: [3.0, 7.0]
      speed_osc_frac: 0.4          # speed varies +/-40% -> sustained acceleration
      yaw_osc_amp_deg: 15.0        # peak yaw rate ~ 2*pi*15/4 = 24 deg/s
      yaw_osc_period_s: [3.0, 5.0]
      pitch_osc_amp_deg: 4.0
  occlusion_s: [0.0, 1.0, 2.0]     # 0.0 = near-miss control (occluder passes beside target)
  blur:
    # Post-render linear motion blur, applied deterministically to the SAME
    # rendered flight (paired design). It is a controlled image degradation,
    # not a sensor model.
    none: 0
    motion: 9                      # kernel length in pixels               PILOT
  target_group: [uav, ground]

# ---------------------------------------------------------------- design
design:
  # Seeds per (camera_motion x occlusion x target_group) cell. Blur is paired
  # within each rendered flight, so one flight yields two clips.
  dev_seeds: 6        # 12 cells x 6 = 72 dev flights (48 train / 24 val) -> 144 dev clips
  test_seeds: 3       # 12 cells x 3 = 36 test flights                    ->  72 test clips
  val_seeds_per_cell: 2
  # Layouts are held out at every level so validation mimics the unseen-layout
  # test condition used to judge the 95%-precision operating point.
  train_layouts: [L0, L1, L2]
  val_layouts: [L3]
  test_layouts: [L4, L5]
  master_seed: 20261023

# ---------------------------------------------------------------- targets
targets:
  uav:
    count: [3, 8]
    size_m: [0.6, 0.6, 0.25]       # quadrotor bounding box (length, width, height)
    speed_mps: [2.0, 6.0]
    altitude_m: [4.0, 12.0]
    area_half_m: 10.0              # targets stay within +/- this of the scene centre
  ground:
    count: [3, 8]
    size_m: [4.5, 1.9, 1.5]
    speed_mps: [3.0, 9.0]
    altitude_m: [0.75, 0.75]       # box centre height for a car on the ground
    area_half_m: 25.0
  crossings_per_clip: 1            # pairs scripted to pass the same point

observer:
  uav:    {standoff_m: 20.0, height_m: 8.0}   # UAVs ~15-45 px wide; check in pilot
  ground: {standoff_m: 50.0, height_m: 25.0}
  look_at_smoothing_s: 1.5         # low-pass on the target centroid the camera aims at

# ---------------------------------------------------------------- occluders
occlusion:
  events_per_clip: 3
  nominal_starts_s: [4.5, 9.5, 14.5]
  start_jitter_s: 0.5
  ramp_s: 0.3                      # slide-in / slide-out time
  depth_fraction: 0.4              # panel sits 40% of the way from camera to target
  cover_margin: 1.5                # panel size vs. target silhouette at that depth
  min_panel_m: 1.0
  thickness_m: 0.05
  near_miss_gap_frac: 0.6          # 0 s control: panel stops this far beside the target
  near_miss_hold_s: 1.0
  eligibility_margin_s: 1.3        # target must be in view this long before/after
  calibrate_vis_threshold: 0.5     # MUST equal event_protocol.yaml vis_threshold: the
                                   # scheduler sizes the cover window so the span with
                                   # vis below this equals the nominal occlusion duration

# ---------------------------------------------------------------- layouts
layouts:
  # Static low clutter outside the target area; gives texture for camera-motion
  # estimation and some natural partial occlusion of ground vehicles.
  L0: {ground_rgb: [96, 120, 80],  clutter: 12}
  L1: {ground_rgb: [120, 110, 90], clutter: 18}
  L2: {ground_rgb: [90, 100, 110], clutter: 8}
  L3: {ground_rgb: [110, 125, 95], clutter: 24}
  L4: {ground_rgb: [100, 95, 85],  clutter: 15}
  L5: {ground_rgb: [85, 115, 100], clutter: 20}
clutter:
  size_m: [[0.6, 0.6, 0.6], [1.5, 1.5, 1.5]]   # min and max box size
  ring_m: [1.1, 1.6]                            # placed in this multiple of area_half_m
